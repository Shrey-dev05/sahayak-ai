<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sahayak AI — Mobile Companion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<!-- Client-side PDF generation engine -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
:root{
  --bg:#F8FAF9;
  --surface:#FFFFFF;
  --ink:#0F172A;
  --muted:#64748B;
  --indigo:#1E3A8A;
  --indigo-d:#0F172A;
  --marigold:#F59E0B;
  --marigold-d:#D97706;
  --alert:#DC2626;
  --alert-bg:#FEF2F2;
  --green:#059669;
  --green-bg:#ECFDF5;
  --line:#E2E8F0;
  --card-border:#CBD5E1;
  --shadow-sm:0 2px 4px rgba(15, 23, 42, 0.04);
  --shadow-card:0 10px 25px -5px rgba(15, 23, 42, 0.07), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,.brand,.badge-title,.portal-name,.track-title{font-family:'Baloo 2',system-ui,sans-serif}
.wrap{max-width:540px;margin:0 auto;padding:14px 14px 48px}

/* GIGW 3.0 National Masthead & Accessibility Strip */
.tricolor-bar{
  height:4px;
  width:100%;
  background:linear-gradient(90deg, #FF9933 0%, #FF9933 33.3%, #FFFFFF 33.3%, #FFFFFF 66.6%, #138808 66.6%, #138808 100%);
  position:sticky;
  top:0;
  z-index:9999;
}
.skip-link{
  position:absolute;
  top:-60px;
  left:10px;
  background:#173047;
  color:#FFEB3B;
  border:2px solid #FFEB3B;
  padding:6px 14px;
  font-weight:700;
  font-size:.82rem;
  z-index:99999;
  border-radius:4px;
  text-decoration:none;
  transition:top .2s ease;
}
.skip-link:focus{top:8px}

.gov-masthead{
  background:#0B132B;
  color:#E2E8F0;
  padding:6px 14px;
  border-bottom:1px solid rgba(255,255,255,0.08);
}
.gov-masthead-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
}
.gov-identity{
  display:flex;
  align-items:center;
  gap:6px;
  font-weight:700;
  color:#F8FAFC;
  letter-spacing:.2px;
  font-size:.74rem;
  white-space:nowrap;
}
.gov-access-bar{
  display:flex;
  align-items:center;
  gap:6px;
  flex-wrap:nowrap;
}
.access-btn-group{
  display:inline-flex;
  background:rgba(255,255,255,0.12);
  border-radius:6px;
  padding:2px;
  border:1px solid rgba(255,255,255,0.18);
}
.access-btn{
  background:transparent;
  color:#F8FAFC;
  border:none;
  padding:3px 7px;
  font-size:.7rem;
  font-weight:700;
  cursor:pointer;
  border-radius:4px;
  line-height:1.1;
  transition:background .15s ease;
}
.access-btn:hover,.access-btn:focus{
  background:rgba(255,255,255,0.25);
  outline:none;
}
.access-btn.active{
  background:#1E3A8A;
  color:#FFFFFF;
}
.contrast-btn{
  background:rgba(255,255,255,0.12);
  color:#F8FAFC;
  border:1px solid rgba(255,255,255,0.18);
  padding:3px 8px;
  border-radius:6px;
  font-size:.7rem;
  font-weight:700;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  gap:4px;
  transition:all .15s;
  white-space:nowrap;
  line-height:1.1;
}
.contrast-btn:hover,.contrast-btn.active{
  background:rgba(255,255,255,0.28);
  color:#FFEB3B;
  border-color:#FFEB3B;
}

/* Official Portal Brand Bar with State Emblem */
.portal-header{
  background:#FFFFFF;
  border-bottom:2px solid #E2E8F0;
  padding:10px 14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  box-shadow:0 2px 6px rgba(15, 23, 42, 0.04);
}
.portal-header-left{
  display:flex;
  align-items:center;
  gap:10px;
  flex:1;
  min-width:0;
}
.emblem-wrap{
  width:40px;
  height:48px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
  color:#173047;
}
.emblem-svg{
  width:100%;
  height:100%;
}
.portal-title-block{
  display:flex;
  flex-direction:column;
  min-width:0;
  flex:1;
}
.portal-ministry{
  font-size:.62rem;
  font-weight:700;
  color:#64748B;
  text-transform:uppercase;
  letter-spacing:.3px;
  line-height:1.2;
}
.portal-name{
  font-size:1.15rem;
  font-weight:800;
  color:#173047;
  line-height:1.2;
  margin:2px 0 1px;
}
.portal-sub{
  font-size:.68rem;
  color:#059669;
  font-weight:700;
  margin-top:1px;
  line-height:1.3;
}
.digital-india-badge{
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  text-align:right;
  flex-shrink:0;
}
.digital-india-logo{
  font-size:.68rem;
  font-weight:800;
  color:#FF9933;
  letter-spacing:.3px;
  background:#FFF7ED;
  border:1px solid #FFEDD5;
  padding:3px 8px;
  border-radius:6px;
  white-space:nowrap;
}
.verified-gov-tag{
  font-size:.62rem;
  color:#059669;
  font-weight:700;
  margin-top:3px;
  display:flex;
  align-items:center;
  gap:3px;
  white-space:nowrap;
}

/* Lang Toggle Button (GIGW 3.0 accessible) */
.lang-toggle-btn{
  display:inline-flex;
  align-items:center;
  gap:4px;
  background:linear-gradient(135deg, #1E3A8A 0%, #1E40AF 100%);
  color:#FFFFFF;
  border:1.5px solid #93C5FD;
  box-shadow:0 2px 8px rgba(30, 58, 138, 0.2);
  padding:3px 10px;
  border-radius:999px;
  font-size:.72rem;
  font-weight:700;
  cursor:pointer;
  transition:all .18s ease;
  letter-spacing:.2px;
  white-space:nowrap;
  line-height:1.1;
}
.lang-toggle-btn:hover{
  transform:translateY(-1px);
  box-shadow:0 4px 12px rgba(30, 58, 138, 0.3);
}
.lang-toggle-btn:active{transform:scale(0.97)}
.lang-toggle-btn .lang-icon{font-size:.82rem}

/* Grievance Tracking / Case Card */
.grievance-track-card{
  background:linear-gradient(135deg, #173047 0%, #0F172A 100%);
  color:#FFFFFF;
  border-radius:18px;
  padding:15px 16px;
  margin:12px 0 16px;
  box-shadow:0 10px 25px rgba(23, 48, 71, 0.2);
  border:1.5px solid #334155;
  position:relative;
  overflow:hidden;
}
.grievance-track-card::before{
  content:'';
  position:absolute;
  top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg, #FF9933 0%, #FFFFFF 50%, #138808 100%);
}
.track-top-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:10px;
}
.track-id-badge{
  font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
  background:rgba(255,255,255,0.12);
  border:1px solid rgba(255,255,255,0.22);
  padding:4px 9px;
  border-radius:8px;
  font-size:.75rem;
  font-weight:700;
  color:#FFEB3B;
  letter-spacing:.4px;
  white-space:nowrap;
}
.track-status-pill{
  display:inline-flex;
  align-items:center;
  gap:5px;
  background:#ECFDF5;
  color:#065F46;
  padding:3px 9px;
  border-radius:999px;
  font-size:.72rem;
  font-weight:700;
  white-space:nowrap;
}
.track-status-dot{
  width:7px;height:7px;border-radius:50%;background:#059669;
  animation:pulseDot 1.5s infinite;
  flex-shrink:0;
}
@keyframes pulseDot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.6;transform:scale(0.85)}}
.track-title{
  font-size:1.12rem;
  font-weight:700;
  margin:0 0 5px;
  line-height:1.25;
}
.track-sub{
  font-size:.82rem;
  color:#E2E8F0;
  opacity:.92;
  line-height:1.45;
  margin:0;
}
.track-meta-grid{
  display:flex;
  flex-direction:column;
  gap:7px;
  margin-top:12px;
  padding-top:10px;
  border-top:1px dashed rgba(255,255,255,0.2);
}
.track-meta-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.12);
  border-radius:9px;
  padding:7px 11px;
  gap:10px;
}
.track-meta-label{
  font-size:.67rem;
  color:#94A3B8;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.3px;
  white-space:nowrap;
  flex-shrink:0;
}
.track-meta-val{
  font-size:.77rem;
  font-weight:700;
  color:#F8FAFC;
  text-align:right;
  line-height:1.3;
}

/* Backward compatibility banner class */
.banner{
  background:linear-gradient(135deg, #1E3A8A 0%, #0F172A 100%);
  color:#fff;
  border-radius:20px;
  padding:18px 20px;
  margin-bottom:16px;
  box-shadow:0 12px 28px rgba(30, 58, 138, 0.2);
}
.banner h1{margin:0 0 6px;font-size:1.22rem;font-weight:700}
.banner p{margin:0;font-size:.88rem;opacity:.92}
.banner-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,0.18);padding:4px 12px;border-radius:999px;font-size:.74rem}

/* Main Card Containers */
.section{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:20px;
  padding:20px 18px;
  margin-bottom:16px;
  box-shadow:var(--shadow-card);
}
.section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.section h2{margin:0;font-size:1.08rem;color:var(--indigo);font-weight:700;display:flex;align-items:center;gap:8px}

/* Rural-Friendly Action Guide Card */
.action-guide-card{
  background:#FFFFFF;
  border:2px solid var(--marigold);
  border-radius:20px;
  padding:16px 15px;
  margin-bottom:16px;
  box-shadow:0 12px 30px rgba(245, 158, 11, 0.12);
}
.guide-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  margin-bottom:12px;
  border-bottom:1.5px dashed var(--line);
  padding-bottom:10px;
}
.guide-title{font-size:1.1rem;font-weight:700;color:var(--indigo);margin:0;line-height:1.25}
.guide-subtitle{font-size:.8rem;color:var(--muted);margin-top:3px;line-height:1.35}

/* Top Quick Action Bar: Audio & PDF */
.action-bar{display:flex;gap:8px;margin-bottom:14px}
.audio-btn,.pdf-btn{
  flex:1;
  border:none;
  border-radius:12px;
  padding:10px 8px;
  font-weight:700;
  font-size:.82rem;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  gap:6px;
  min-height:44px;
  line-height:1.25;
  transition:all .18s ease;
}
.audio-btn{background:#EFF6FF;color:var(--indigo);border:1px solid #DBEAFE}
.audio-btn:hover{background:#DBEAFE}
.audio-btn.speaking{
  background:var(--indigo);
  color:#fff;
  border-color:var(--indigo);
  animation:pulseAudio 1.2s infinite;
}
@keyframes pulseAudio{0%,100%{box-shadow:0 0 0 0 rgba(30,58,138,0.4)}50%{box-shadow:0 0 0 6px rgba(30,58,138,0)}}

.pdf-btn{
  background:linear-gradient(135deg, var(--marigold) 0%, var(--marigold-d) 100%);
  color:#fff;
  box-shadow:0 4px 14px rgba(245, 158, 11, 0.28);
}
.pdf-btn:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(245, 158, 11, 0.38)}

/* Visual Micro-Cards inside Action Guide */
.micro-card{
  background:#F8FAFC;
  border:1px solid #E2E8F0;
  border-radius:14px;
  padding:13px 12px;
  margin-bottom:12px;
}
.micro-card-title-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  margin-bottom:10px;
  flex-wrap:wrap;
}
.micro-card-title{
  font-family:'Baloo 2',sans-serif;
  font-weight:700;
  font-size:.95rem;
  color:var(--indigo);
  margin:0;
  display:flex;
  align-items:center;
  gap:6px;
  line-height:1.25;
}
.micro-card-title-row .micro-card-title{margin-bottom:0}
.check-progress-pill{
  font-size:.74rem;
  font-weight:700;
  padding:3px 9px;
  border-radius:999px;
  background:#EFF6FF;
  color:var(--indigo);
  border:1px solid #BFDBFE;
  transition:all .2s ease;
  white-space:nowrap;
}
.check-progress-pill.all-done{
  background:#ECFDF5;
  color:var(--green);
  border-color:#A7F3D0;
}

/* Interactive Checkbox List */
.checklist{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.check-item{
  display:flex;
  align-items:flex-start;
  gap:10px;
  background:#fff;
  border:1.5px solid #E2E8F0;
  border-radius:12px;
  padding:9px 12px;
  cursor:pointer;
  user-select:none;
  transition:all .15s ease;
}
.check-item:hover{border-color:var(--marigold)}
.check-item input[type=checkbox]{
  margin-top:2px;
  accent-color:var(--green);
  width:18px;height:18px;
  cursor:pointer;
  flex-shrink:0;
}
.check-label{font-size:.88rem;line-height:1.38;flex:1;color:var(--ink);word-break:break-word}
.check-item.done{background:#F0FDF4;border-color:var(--green)}
.check-item.done .check-label{color:#64748B;text-decoration:line-through}

/* Numbered Steps */
.step-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:9px}
.step-item{display:flex;align-items:flex-start;gap:10px}
.step-badge{
  background:linear-gradient(135deg, var(--indigo) 0%, #3B82F6 100%);
  color:#fff;
  width:24px;height:24px;
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:.78rem;font-weight:700;
  flex-shrink:0;
  margin-top:1px;
  box-shadow:0 2px 5px rgba(30,58,138,0.22);
}
.step-content{font-size:.88rem;line-height:1.42;color:var(--ink);flex:1;word-break:break-word}

/* Warning & Alerts */
.warning-box{
  background:var(--alert-bg);
  border:1.5px solid #FCA5A5;
  border-radius:12px;
  padding:11px 12px;
  margin-bottom:12px;
  display:flex;gap:10px;
  align-items:flex-start;
}
.warning-icon{
  width:24px;
  height:24px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
  margin-top:1px;
}
.warning-svg{
  width:22px;
  height:22px;
  stroke:#B45309;
  display:block;
}
.warning-text{font-size:.84rem;line-height:1.42;color:#991B1B;flex:1;word-break:break-word}

/* Click-to-Call Helplines */
.helpline-grid{
  display:flex;
  flex-direction:column;
  gap:8px;
  margin-top:10px;
}
.phone-chip{
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:#FFFFFF;
  border:1.5px solid #BBF7D0;
  border-radius:12px;
  padding:9px 12px;
  text-decoration:none;
  transition:all .18s ease;
  box-shadow:var(--shadow-sm);
  gap:10px;
}
.phone-chip:hover{
  background:#F0FDF4;
  border-color:var(--green);
  transform:translateY(-1px);
}
.phone-chip-left{
  display:flex;
  align-items:center;
  gap:10px;
  flex:1;
  min-width:0;
}
.phone-chip-icon{
  width:32px;
  height:32px;
  border-radius:50%;
  background:#DCFCE7;
  color:#15803D;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
}
.phone-svg{
  width:16px;
  height:16px;
  stroke:currentColor;
  display:block;
}
.phone-chip-info{
  display:flex;
  flex-direction:column;
  text-align:left;
  min-width:0;
}
.phone-chip-title{
  font-size:.83rem;
  font-weight:700;
  color:#0F172A;
  line-height:1.25;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.phone-chip-sub{
  font-size:.73rem;
  color:#15803D;
  font-weight:600;
  margin-top:1px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.call-badge{
  background:#059669;
  color:#FFFFFF;
  font-size:.74rem;
  font-weight:700;
  padding:4px 10px;
  border-radius:999px;
  letter-spacing:.2px;
  flex-shrink:0;
  white-space:nowrap;
}

/* Quick Suggestion Chips */
.quick-chip-row{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:4px 2px 10px;
  margin-top:12px;
  -webkit-overflow-scrolling:touch;
}
.quick-chip-row::-webkit-scrollbar{display:none}
.quick-chip{
  flex-shrink:0;
  background:#EFF6FF;
  border:1.5px solid #BFDBFE;
  color:#1E40AF;
  padding:7px 13px;
  border-radius:999px;
  font-size:.82rem;
  font-weight:600;
  cursor:pointer;
  transition:all .15s ease;
}
.quick-chip:hover{
  background:#DBEAFE;
  border-color:#93C5FD;
  transform:translateY(-1px);
}
.quick-chip:active{transform:scale(0.97)}

/* Chat History / Continuation */
.log{display:flex;flex-direction:column;gap:14px;max-height:380px;overflow-y:auto;padding-right:4px}
.log::-webkit-scrollbar{width:4px}
.log::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:4px}
.bubble{
  padding:14px 16px;
  border-radius:18px;
  font-size:.94rem;
  line-height:1.48;
  max-width:90%;
  box-shadow:var(--shadow-sm);
}
.bubble.user{
  align-self:flex-end;
  background:linear-gradient(135deg, var(--indigo) 0%, #1E40AF 100%);
  color:#fff;
  border-bottom-right-radius:4px;
}
.bubble.assistant{
  align-self:flex-start;
  background:#FFFFFF;
  border:1px solid #E2E8F0;
  border-bottom-left-radius:4px;
  color:var(--ink);
}
.bubble .src{
  margin-top:8px;
  font-size:.78rem;
  color:var(--muted);
  border-top:1px dashed var(--line);
  padding-top:8px;
}

/* Rich Formatted Solution Cards inside Mobile Chat */
.bubble .kiosk-card-heading {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: #EFF6FF;
  border: 1px solid #BFDBFE;
  color: #1E40AF;
  padding: 4px 10px;
  border-radius: 8px;
  font-size: .82rem;
  font-weight: 700;
  margin: 6px 0 8px;
}
.bubble .kiosk-step-row {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  background: #F8FAFC;
  border: 1px solid #E2E8F0;
  border-radius: 12px;
  padding: 9px 12px;
  margin-bottom: 8px;
  line-height: 1.45;
}
.bubble .kiosk-step-icon {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: .78rem;
  flex-shrink: 0;
  margin-top: 1px;
}
.bubble .step-check { background: #ECFDF5; color: #059669; border: 1px solid #A7F3D0; }
.bubble .step-doc { background: #EFF6FF; color: #2563EB; border: 1px solid #BFDBFE; }
.bubble .step-warn { background: #FFFBEB; color: #D97706; border: 1px solid #FDE68A; }
.bubble .step-phone { background: #F0FDF4; color: #16A34A; border: 1px solid #BBF7D0; }
.bubble .kiosk-step-text {
  font-size: .88rem;
  color: #1E293B;
  flex: 1;
}
.bubble .kiosk-step-text strong { color: #0F172A; font-weight: 700; }
.bubble .kiosk-alert-tag {
  background: #FEF3C7;
  color: #B45309;
  border: 1px solid #FCD34D;
  padding: 1px 7px;
  border-radius: 6px;
  font-weight: 700;
  font-size: .8rem;

const esc = s => { const d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; };

// High-Readability Solution Formatter for Mobile Companion
function formatRichSolution(raw, lang) {
  if (!raw || !raw.trim()) return '';
  const text = raw.trim();
  const rawLines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
  let html = '';

  const phoneRe = /(\b(?:14447|1800[- ]?\d{3}[- ]?\d{4}|\d{5,10})\b)/g;
  const deadlineRe = /(\b\d+\s*(?:घंटे|घंटों|दिन|ghante|ghanton|din|hours?|days?)\b|72\s*(?:घंटे|hours?|ghante)|3\s*(?:दिन|days?|din))/gi;
  const docKeywords = /(dastaavez|dastavez|document|documents|kaagaz|aadhaar|aadhar|passbook|khasra|khatoni|khatouni|girdawari|patta|pan\s*card|photo|rashan|ration|दस्तावेज़|कागज़ात|कागजात|आधार|पासबुक|खसरा|खतौनी|गिरदावरी|पट्टा)/i;
  const warnKeywords = /(warning|alert|zaroori|deadline|sachet|dhyaan|72|ghante|hours?|savdhan|चाहिए|चेतावनी|सावधान|समय\s*सीमा|घंटे|दिन)/i;
  const phoneKeywords = /(helpline|call|toll-free|number|contact|phone|संपर्क|कॉल|हेल्पलाइन|नंबर|14447)/i;
  const headingKeywords = /^(तुरंत|मुख्य|कदम|key\s+steps|action\s+steps|steps\s+to|samadhan|zaroori\s+kadam|action\s+plan|महत्वपूर्ण)/i;

  function formatInline(str) {
    let s = esc(str);
    s = s.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
    s = s.replace(deadlineRe, '<span class="kiosk-alert-tag">⏰ $1</span>');
    s = s.replace(phoneRe, (m, p1) => {
      const cleanNum = p1.replace(/[- ]/g, '');
      return `<a class="kiosk-phone-pill" href="tel:${cleanNum}">📞 ${p1}</a>`;
    });
    return s;
  }

  for (let line of rawLines) {
    const isBullet = /^[\*•\-\–\—]/.test(line);
    const isNumbered = /^\d+[\.\)]\s*/.test(line);
    const cleanContent = line.replace(/^[\*•\-\–\—]\s*/, '').replace(/^\d+[\.\)]\s*/, '').trim();

    if (!isBullet && !isNumbered && (cleanContent.endsWith(':') || headingKeywords.test(cleanContent)) && cleanContent.length < 60) {
      const headingText = cleanContent.replace(/[:：]$/, '');
      html += `<div class="kiosk-card-heading">📌 ${formatInline(headingText)}</div>`;
      continue;
    }

    if (cleanContent.length > 0) {
      let iconClass = 'step-check';
      let iconSymbol = '✓';

      if (phoneKeywords.test(cleanContent) || phoneRe.test(cleanContent)) {
        iconClass = 'step-phone';
        iconSymbol = '📞';
      } else if (docKeywords.test(cleanContent)) {
        iconClass = 'step-doc';
        iconSymbol = '📋';
      } else if (warnKeywords.test(cleanContent)) {
        iconClass = 'step-warn';
        iconSymbol = '⚠️';
      }

      html += `
        <div class="kiosk-step-row">
          <div class="kiosk-step-icon ${iconClass}">${iconSymbol}</div>
          <div class="kiosk-step-text">${formatInline(cleanContent)}</div>
        </div>`;
    }
  }

  return html || formatInline(text);
}

// Clean text for speech synthesis without pronouncing markdown symbols
function cleanForSpeech(raw, lang) {
  if (!raw) return '';
  let s = raw;
  s = s.replace(/\[([^\]]+)\]\([^\)]+\)/g, '$1');
  s = s.replace(/https?:\/\/\S+|www\.\S+/g, '');
  s = s.replace(/[*_~`#]+/g, ' ');

  // Format helpline numbers for clear digit-by-digit spoken delivery
  s = s.replace(/\b1800[- ]?180[- ]?1551\b/g, '1 8 0 0, 1 8 0, 1 5 5 1');
  s = s.replace(/\b1800[- ]?11[- ]?4000\b/g, '1 8 0 0, 1 1, 4 0 0 0');
  s = s.replace(/\b14447\b/g, '1 4 4 4 7');
  s = s.replace(/\b1915\b/g, '1 9 1 5');

  // Scheme acronyms
  s = s.replace(/\bPM-?KISAN\b/gi, 'P M Kisan');
  s = s.replace(/\bPMFBY\b/g, 'P M F B Y');
  s = s.replace(/\bKCC\b/g, 'K C C');
  s = s.replace(/\bCSC\b/g, 'C S C');
  s = s.replace(/\bCSCs\b/g, 'C S C centers');
  s = s.replace(/\bDBT\b/g, 'D B T');
  s = s.replace(/\bKYC\b/g, 'K Y C');
  s = s.replace(/\be-?KYC\b/gi, 'E K Y C');
  s = s.replace(/\bFPO\b/g, 'F P O');

  if (lang === 'hi') {
    s = s.replace(/\bPACS\b/g, 'पैक्स');
    s = s.replace(/\b7\s*\/\s*12\b/g, 'सात बारह');
    s = s.replace(/₹\s*(\d+)/g, '$1 रुपये');
    s = s.replace(/Rs\.?\s*(\d+)/gi, '$1 रुपये');
    s = s.replace(/(\d+)\s*%/g, '$1 प्रतिशत');
    s = s.replace(/([A-Za-z0-9\u0900-\u097F]+)\/([A-Za-z0-9\u0900-\u097F]+)/g, '$1 या $2');
  } else {
    s = s.replace(/\bPACS\b/g, 'Paks');
    s = s.replace(/\b7\s*\/\s*12\b/g, '7 12 land records');
    s = s.replace(/₹\s*(\d+)/g, '$1 rupees');
    s = s.replace(/Rs\.?\s*(\d+)/gi, '$1 rupees');
    s = s.replace(/(\d+)\s*%/g, '$1 percent');
    s = s.replace(/([A-Za-z0-9]+)/g, '$1');
    s = s.replace(/([A-Za-z0-9]+)\/([A-Za-z0-9]+)/g, '$1 or $2');
  }

  s = s.replace(/([\u2700-\u27BF]|[\uE000-\uF8FF]|\uD83C[\uDC00-\uDFFF]|\uD83D[\uDC00-\uDFFF]|[\u2011-\u26FF]|\uD83E[\uDD10-\uDDFF])/g, '');

  // Natural cadence & sentence pauses between bullet points and lines
  const lines = s.split('\n').map(l => l.trim()).filter(Boolean);
  const cleanedLines = [];
  const endPunc = lang === 'hi' ? '।' : '.';
  for (let l of lines) {
    l = l.replace(/^\s*[-+*•]\s+/, '');
    l = l.replace(/^\s*(?:Step|कदम)?\s*\d+[\.\):\-]\s*/i, '');
    l = l.replace(/[\[\]{}<>|\\()\"'`~^@#*]/g, ' ');
    l = l.replace(/\s+/g, ' ').trim();
    if (l) {
      if (!/[.!?,;:।]$/.test(l)) l += endPunc;
      cleanedLines.push(l);
    }
  }

  s = cleanedLines.join(' ');
  s = s.replace(/[-—_+=]+/g, ' ');
  s = s.replace(/\s+/g, ' ').trim();
  return s;
}

let activeMobileAudio = null;
let currentMobileLang = 'en';

function stopMobileAudio() {
  if (activeMobileAudio) {
    activeMobileAudio.pause();
    activeMobileAudio.currentTime = 0;
    activeMobileAudio = null;
  }
  if (window.speechSynthesis) {
    window.speechSynthesis.cancel();
  }
  const ab = document.getElementById('listenGuideBtn');
  if (ab) {
    ab.classList.remove('speaking');
    const audioText = document.getElementById('audioBtnText');
    if (audioText) audioText.textContent = (UI[currentMobileLang] || UI.en).listenBtn;
  }
  document.querySelectorAll('.bubble-audio-btn').forEach(b => b.classList.remove('playing'));
}

function playMobileNeuralAudio(text, lang, onStart, onEnd) {
  if (activeMobileAudio) {
    stopMobileAudio();
    return;
  }
  stopMobileAudio();
  const cleaned = cleanForSpeech(text, lang);
  if (!cleaned) return;

  const audioUrl = `${API}/voice/tts?text=${encodeURIComponent(cleaned)}&language=${encodeURIComponent(lang || 'en')}`;
  try {
    const a = new Audio(audioUrl);
    activeMobileAudio = a;
    if (onStart) onStart();

    a.onended = () => {
      activeMobileAudio = null;
      if (onEnd) onEnd();
      stopMobileAudio();
    };
    a.onerror = () => {
      activeMobileAudio = null;
      speakBrowserFallbackMobile(cleaned, lang, onEnd);
    };
    a.play().catch(() => {
      activeMobileAudio = null;
      speakBrowserFallbackMobile(cleaned, lang, onEnd);
    });
  } catch(e) {
    speakBrowserFallbackMobile(cleaned, lang, onEnd);
  }
}

function speakBrowserFallbackMobile(cleanedText, lang, onEnd) {
  try {
    if (!window.speechSynthesis) {
      if (onEnd) onEnd();
      return;
    }
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(cleanedText);
    const targetLang = (lang === 'hi') ? 'hi-IN' : 'en-IN';
    u.lang = targetLang;
    u.rate = 0.93;
    u.pitch = 1.0;

    const voices = window.speechSynthesis.getVoices();
    if (voices && voices.length > 0) {
      const match = voices.find(v => v.lang === targetLang || v.lang.startsWith(targetLang.split('-')[0]));
      if (match) u.voice = match;
    }

    u.onend = () => { if (onEnd) onEnd(); stopMobileAudio(); };
    u.onerror = () => { if (onEnd) onEnd(); stopMobileAudio(); };
    window.speechSynthesis.speak(u);
  } catch(e) {
    if (onEnd) onEnd();
    stopMobileAudio();
  }
}

  document.body.classList.toggle('high-contrast', isHighContrast);
  localStorage.setItem('sahayak_high_contrast', isHighContrast ? '1' : '0');
  const btn = document.getElementById('contrastToggle');
  if (btn) btn.classList.toggle('active', isHighContrast);
}

function getPlanData(lang) {
  const defaults = DEFAULT_PLANS[lang] || DEFAULT_PLANS.hi;
  if (!userCustomPlan) return defaults;
  return {
    title: userCustomPlan.title || defaults.title,
    documents: (userCustomPlan.documents_required && userCustomPlan.documents_required.length) ? userCustomPlan.documents_required : defaults.documents,
    steps: (userCustomPlan.steps && userCustomPlan.steps.length) ? userCustomPlan.steps : defaults.steps,
    warnings: (userCustomPlan.warnings && userCustomPlan.warnings.length) ? userCustomPlan.warnings : defaults.warnings
  };
}

  };

  // Full action guide text for voice reading
  function getActionGuideSpokenScript() {
    const dStr = docList.join(', ');
    const sStr = stepList.map((st, i) => `Step ${i+1}: ${st}`).join('. ');
    const wStr = warnList.join('. ');
    if (lang === 'hi') {
      return `जन समाधान आधिकारिक प्रशासनिक निर्देश। साथ ले जाने वाले आवश्यक सरकारी दस्तावेज़ हैं: ${dStr}। वैधानिक समाधान प्रक्रिया: ${sStr}। महत्वपूर्ण चेतावनी: ${wStr}। सहायता के लिए टोल फ्री 14447 पर कॉल करें।`;
    } else {
      return `Jan Samadhan Official Resolution Directive. Mandatory supporting documents: ${dStr}. Statutory resolution process: ${sStr}. Important compliance warnings: ${wStr}. For immediate support, call 14447.`;
    }
  }

  // Audio Button Listener
  const listenBtn = document.getElementById('listenGuideBtn');
  listenBtn.onclick = () => {
    if (activeMobileAudio) {
      stopMobileAudio();
      return;
    }
    const textToSpeak = getActionGuideSpokenScript();
    const audioText = document.getElementById('audioBtnText');
    playMobileNeuralAudio(
      textToSpeak,
      lang,
      () => {
        listenBtn.classList.add('speaking');
        if (audioText) audioText.textContent = S().stopBtn;
      },
      () => {
        listenBtn.classList.remove('speaking');
        if (audioText) audioText.textContent = S().listenBtn;
      }
    );
  };

  // PDF Download Button Listener
  const downloadPdfBtn = document.getElementById('downloadPdfBtn');
  downloadPdfBtn.onclick = () => {
    const pdfText = document.getElementById('pdfBtnText');
    if (pdfText) pdfText.textContent = S().generatingPdf;
    setTimeout(() => {
      const curPlan = getPlanData(lang);
      generateActionGuidePDF({
        title: lastUserMsg || S().guideHeader,
        documents: curPlan.documents,
        steps: curPlan.steps,
        warnings: curPlan.warnings,
        body: latestDetailedSolution
      }, lastUserMsg, lang);
      if (pdfText) pdfText.textContent = S().downloadPdfBtn;
    }, 200);
  };

  // Render prior and active conversation history
  const log = document.getElementById('mobiLog');
  function addBubble(role, text, src, audioUrl){
    const b = document.createElement('div');
    b.className = 'bubble ' + role;
    if (role === 'assistant') {
      b.innerHTML = formatRichSolution(text, lang);
    } else {
      let formatted = esc(text)
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/^\s*[\*\-]\s+(.*)$/gm, '• $1')
        .replace(/\n/g, '<br>');
      b.innerHTML = formatted;
    }
    if (src) {
      const s = document.createElement('div');
      s.className = 'src';
      s.innerHTML = `<span style="font-weight:700">${esc(S().sourceLabel)}:</span> ` + esc(src);
      b.appendChild(s);
    }
    if (role === 'assistant') {
      const audioAction = document.createElement('button');
      audioAction.className = 'bubble-audio-btn';
      audioAction.innerHTML = `
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:inline-block;vertical-align:middle">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>
        </svg>
        <span>${S().listenAudio}</span>`;
      audioAction.onclick = () => {
        if (activeMobileAudio && audioAction.classList.contains('playing')) {
          stopMobileAudio();
        } else {
          stopMobileAudio();
          audioAction.classList.add('playing');
          playMobileNeuralAudio(
            text,
            lang,
            () => {
              audioAction.classList.add('playing');
            },
            () => {
              audioAction.classList.remove('playing');
            }
          );
        }
      };
      b.appendChild(audioAction);
    }
    log.appendChild(b);
    log.scrollTop = log.scrollHeight;
  }

  allMessages.forEach(m => addBubble(m.role, m.text, m.src, m.audioUrl));

  // Chat Handler on Mobile
  async function handleMobileChat(text){
    if (!text || !text.trim()) return;
    addBubble('user', text);
    allMessages.push({role: 'user', text});
    lastUserMsg = text;
    const inputEl = document.getElementById('mobiTextInput');
    if (inputEl) inputEl.value = '';

    // Check if user requested a PDF via chat
    const isPdfRequest = /\b(pdf|download\s+pdf|make\s+a?\s*pdf|generate\s+pdf|pdf\s+bana|pdf\s+chahiye|pdf\s+banao)\b/i.test(text);

    try {
      const r = await fetch(`${API}/chat`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({session_id: sessionId, text, language: lang})
      });
      const res = await r.json();
      const detectedLang = res.language || 'en';
      const src = res.sources && res.sources[0] ? `${res.sources[0].title} — ${res.sources[0].issuer||''}` : null;
      latestDetailedSolution = res.answer_text;
      allMessages.push({role: 'assistant', text: res.answer_text, src, audioUrl: res.audio_url});

      if (res.action_plan) {
        userCustomPlan = res.action_plan;
      }

      // Automatic Language Identification:
      // If user spoke/typed in Hindi or English and it differs from current dashboard display,
      // seamlessly adapt the dashboard language without requiring manual switching!
      const targetPortalLang = (detectedLang === 'hi') ? 'hi' : 'en';
      if (targetPortalLang !== currentMobileLang) {
        currentMobileLang = targetPortalLang;
        localStorage.setItem('sahayak_mobile_lang', currentMobileLang);
        renderDashboard();
      } else {
        addBubble('assistant', res.answer_text, src, res.audio_url);
        if (res.action_plan) {
          const newPlan = getPlanData(lang);
          const newDocs = newPlan.documents;
          const checkContainer = document.getElementById('checkListContainer');
          if (checkContainer) {
            checkContainer.innerHTML = newDocs.map((doc, idx) => {
              const isChecked = checkedDocIndices.has(idx);
              return `
                <li class="check-item ${isChecked ? 'done' : ''}" data-idx="${idx}">
                  <input type="checkbox" id="chk_${idx}" ${isChecked ? 'checked' : ''}>
                  <label class="check-label" for="chk_${idx}">${esc(doc)}</label>
                </li>
              `;
            }).join('');
            document.querySelectorAll('.check-item').forEach(item => {
              const idx = parseInt(item.getAttribute('data-idx'), 10);
              const chk = item.querySelector('input[type=checkbox]');
              chk.addEventListener('change', () => {
                if (chk.checked) {
                  checkedDocIndices.add(idx);
                  item.classList.add('done');
                } else {
                  checkedDocIndices.delete(idx);
                  item.classList.remove('done');
                }
                updateProgressBadge();
              });
            });
            updateProgressBadge();
          }
        }
      }

      // If user requested PDF or backend signaled trigger_pdf
      if (isPdfRequest || res.trigger_pdf) {
        setTimeout(() => {
          const currentPlan = getPlanData(lang);
          generateActionGuidePDF({
            title: lastUserMsg || S().guideHeader,
            documents: currentPlan.documents,
            steps: currentPlan.steps,
            warnings: currentPlan.warnings,
            body: latestDetailedSolution
          }, lastUserMsg, lang);
        }, 500);
      }
    } catch(e) {
      addBubble('assistant', S().connErr);
    }
  }

  // Quick suggestion chips click listeners
  document.querySelectorAll('.quick-chip').forEach(chip => {
    chip.onclick = () => {
      const q = chip.getAttribute('data-query');
      if (q) handleMobileChat(q);
    };
  });

  document.getElementById('mobiSendBtn').onclick = () => {
    const inputEl = document.getElementById('mobiTextInput');
    if (inputEl) handleMobileChat(inputEl.value);
  };
  document.getElementById('mobiTextInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') handleMobileChat(e.target.value);
  });

  // Speech Recognition on Mobile
  let recog = null, listening = false;
  const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
  const mobiMicBtn = document.getElementById('mobiMicBtn');
  if (Rec) {
    recog = new Rec();
    recog.continuous = false;
    recog.interimResults = false;
    recog.onresult = e => handleMobileChat(e.results[0][0].transcript);
    recog.onerror = () => { listening = false; mobiMicBtn.classList.remove('on'); };
    recog.onend = () => { listening = false; mobiMicBtn.classList.remove('on'); };
  }
  mobiMicBtn.onclick = () => {
    if (!recog) return;
    if (listening) { recog.stop(); return; }
    try {
      recog.lang = (lang === 'hi') ? 'hi-IN' : 'en-IN';
      recog.start();
      listening = true;
      mobiMicBtn.classList.add('on');
    } catch(e){}
  };

  // Mobile tools: Camera Upload & Grievance Drafting
  const toolArea = document.getElementById('mobiToolArea');
  document.getElementById('mobiScanBtn').onclick = () => {
    toolArea.innerHTML = `<input type="file" accept="image/*" capture="environment" id="mobiFileIn" style="margin-top:10px">`;
    document.getElementById('mobiFileIn').onchange = async (e) => {
      const f = e.target.files[0]; if (!f) return;
      const url = URL.createObjectURL(f);
      toolArea.innerHTML += `<img class="thumb" src="${url}"><p style="font-size:.82rem;color:var(--muted);margin-top:8px">${lang==='hi'?'अपलोड हो रहा है…':'Analyzing document photo…'}</p>`;
      try {
        const fd = new FormData();
        fd.append('session_id', sessionId);
        fd.append('file', f);
        const upRes = await fetch(`${API}/upload`, {method:'POST', body: fd});
        const up = await upRes.json();
        const anRes = await fetch(`${API}/document/analyze`, {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({upload_id: up.id, language: lang})
        });
        const analyzed = await anRes.json();
        addBubble('assistant', analyzed.answer_text);
        allMessages.push({role: 'assistant', text: analyzed.answer_text});
      } catch(err) {
        toolArea.innerHTML += `<p style="color:var(--muted)">${S().connErr}</p>`;
      }
    };
  };

  document.getElementById('mobiGrievBtn').onclick = () => {
    toolArea.innerHTML = `
      <label style="font-size:.85rem;color:var(--muted)">${S().category}</label>
      <select id="mobiCatSel">${S().cats.map(c=>`<option>${c}</option>`).join('')}</select>
      <label style="font-size:.85rem;color:var(--muted);display:block;margin-top:8px">${S().describeIssue}</label>
      <textarea id="mobiDescTxt"></textarea>
      <button class="gen-btn" id="mobiGenBtn">${S().genDraft}</button>
      <div id="mobiDraftOut"></div>`;
    document.getElementById('mobiGenBtn').onclick = async () => {
      const category = document.getElementById('mobiCatSel').value;
      const description = document.getElementById('mobiDescTxt').value.trim();
      try {
        const r = await fetch(`${API}/grievance/draft`, {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({session_id: sessionId, category, description, language: lang})
        });
        const data = await r.json();
        document.getElementById('mobiDraftOut').innerHTML = `
          <div class="draft-box">${esc(data.draft)}</div>
          <button class="copy-btn" id="mobiCopyBtn">${S().copy}</button>`;
        document.getElementById('mobiCopyBtn').onclick = () => {
          if (navigator.clipboard) {
            navigator.clipboard.writeText(data.draft).then(() => {
              document.getElementById('mobiCopyBtn').textContent = S().copied;
            });
          }
        };
      } catch(e) {
        document.getElementById('mobiDraftOut').textContent = S().connErr;
      }
    };
  };
}

async function init(){
  const params = new URLSearchParams(location.search);
  let token = params.get('token');
  const app = document.getElementById('app');
  let savedSessionId = localStorage.getItem('sahayak_mobile_session');
  let ctx = null;

  // Restore saved accessibility preferences
  const savedFont = localStorage.getItem('sahayak_font_scale');
  if (savedFont) {
    currentFontScale = parseInt(savedFont, 10) || 16;
    document.documentElement.style.fontSize = currentFontScale + 'px';
  }
  const savedContrast = localStorage.getItem('sahayak_high_contrast');
  if (savedContrast === '1') {
    isHighContrast = true;
    document.body.classList.add('high-contrast');
  }

  // 1. Try token join from QR code scan
  if (token) {
    try {
      const r = await fetch(`${API}/qr/join`, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({token})
      });
      if (r.ok) {
        ctx = await r.json();
        localStorage.setItem('sahayak_mobile_session', ctx.session.id);
      }
    } catch(e){}
  }

  // 2. Check URL session_id parameter
  let urlSessionId = params.get('session_id');
  if (!ctx && urlSessionId) {
    try {
      const r = await fetch(`${API}/session/${urlSessionId}`);
      if (r.ok) {
        ctx = await r.json();
        localStorage.setItem('sahayak_mobile_session', ctx.session.id);
      }
    } catch(e){}
  }

  // 3. Graceful fallback to existing session ID (e.g. if user refreshed tab)
  if (!ctx && savedSessionId) {
    try {
      const r = await fetch(`${API}/session/${savedSessionId}`);
      if (r.ok) ctx = await r.json();
    } catch(e){}
  }

  // 4. If opened directly in browser without QR token, auto-create a new mobile session
  if (!ctx) {
    try {
      const createRes = await fetch(`${API}/session`, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({kiosk_id: 'mobile-direct-browser', language: 'hi'})
      });
      if (createRes.ok) {
        const sData = await createRes.json();
        localStorage.setItem('sahayak_mobile_session', sData.id);
        const r2 = await fetch(`${API}/session/${sData.id}`);
        if (r2.ok) ctx = await r2.json();
      }
    } catch(e){}
  }

  if (!ctx) {
    app.innerHTML = `
      <div class="tricolor-bar"></div>
      <header class="gov-masthead" role="banner">
        <div class="gov-identity"><span class="flag-icon">🇮🇳</span> <span>${UI.en.govOfIndia}</span></div>
      </header>
      <div class="wrap" style="text-align:center;padding:48px 16px;">
        <div style="font-size:2.8rem;margin-bottom:8px">🏛️</div>
        <h2 style="font-size:1.15rem;color:var(--indigo);margin:0 0 6px">${UI.en.portalName}</h2>
        <p style="font-size:.92rem;line-height:1.4">${UI.en.invalidSession}</p>
        <p style="font-size:.84rem;color:var(--muted);margin-top:6px">${UI.hi.invalidSession}</p>
      </div>`;
    return;
  }

  currentSessionCtx = ctx;
  const savedLang = localStorage.getItem('sahayak_mobile_lang');
  currentMobileLang = savedLang || (ctx.session && ctx.session.language === 'en' ? 'en' : 'hi');
  if (currentMobileLang !== 'en' && currentMobileLang !== 'hi') currentMobileLang = 'hi';

  allMessages = (ctx.messages && ctx.messages.length) ? [...ctx.messages] : [];
  if (ctx.action_plan) {
    userCustomPlan = ctx.action_plan;
  }

  if (allMessages.length) {
    const userMsgs = allMessages.filter(m => m.role === 'user');
    if (userMsgs.length) lastUserMsg = userMsgs[userMsgs.length - 1].text;
    const asstMsgs = allMessages.filter(m => m.role === 'assistant');
    if (asstMsgs.length) latestDetailedSolution = asstMsgs[asstMsgs.length - 1].text;
  }

  renderDashboard();
}

init();
</script>
</body>
</html>
